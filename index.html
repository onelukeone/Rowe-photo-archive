2;background:var(--ink);-webkit-mask:var(--owl) center/contain no-repeat;mask:var(--owl) center/contain no-repeat}
.submit{position:absolute;top:clamp(18px,4vw,40px);right:clamp(14px,3vw,36px);margin:0;background:var(--acc);color:var(--acc-ink);text-decoration:none;font:600 15px var(--sans);padding:11px 18px;border-radius:99px}
/* toolbar */
.tb{position:sticky;top:0;z-index:5;background:var(--bg);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding-top:10px;padding-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tb input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 16px}
.tb select,.btn{border:1px solid var(--line);background:transparent;border-radius:99px;padding:9px 14px;cursor:pointer;font-family:var(--sans);font-size:14px;font-weight:500}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lab{font:500 13px var(--sans);color:var(--mute)}
.panel{display:none;padding-top:12px}
.panel.open{display:block}
.fg+.fg{margin-top:14px}.fg>.lab{display:block;margin-bottom:6px}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:4px 12px;font:500 13px var(--sans);cursor:pointer}
.chip[aria-pressed=true]{background:var(--tint);border-color:var(--acc);color:var(--ink)}
.status{display:flex;gap:12px;align-items:center;padding-top:14px;padding-bottom:4px;font:500 14px var(--sans);color:var(--mute)}
.clear{background:none;border:0;color:var(--acc);text-decoration:underline;cursor:pointer;padding:0;font:500 14px var(--sans)}
/* groups + varied grid */
h2{font:800 clamp(44px,9vw,120px)/.9 var(--sans);letter-spacing:-.04em;margin:34px 0 12px;display:flex;align-items:baseline;gap:16px}
h2 small{font:500 15px var(--sans);letter-spacing:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:8px}
.tile{position:relative;aspect-ratio:4/3;padding:0;border:0;background:var(--line);overflow:hidden;cursor:pointer;text-align:left;color:#fff}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.tile:hover img{transform:scale(1.04)}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(8,12,16,.78));display:block}
.tile b{display:block;font:600 13px/1.2 var(--sans)}
.tile i{font:500 13px var(--sans)}
.bad::before{content:"Photo unavailable\A Check Drive sharing";white-space:pre;position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);font:500 13px var(--sans)}
body.locked>*:not(#gate){display:none!important}
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.gate[hidden]{display:none}
.gate .owl{width:min(260px,60vw)}
.gate h1{white-space:normal;font-size:clamp(26px,6vw,46px);flex-basis:auto}
.gate form{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gate input{border:1px solid var(--line);background:transparent;border-radius:99px;padding:10px 18px;min-width:220px}
.gate button{background:var(--acc);color:var(--acc-ink);border:0;border-radius:99px;padding:10px 22px;font:600 15px var(--sans);cursor:pointer}
#gerr{color:#c0392b;min-height:1.4em;margin:0}
#hres{max-width:60ch;word-break:break-all;font-size:14px}
.msg{color:var(--mute);padding:50px 0;max-width:60ch;font-style:italic}
footer{padding-top:40px;padding-bottom:40px;color:var(--mute);font-size:14px}
/* viewer */
dialog{padding:0;border:0;width:100vw;height:100dvh;max-width:none;max-height:none;background:#0c1014;color:#eceff3}
dialog::backdrop{background:#0c1014}
.v{display:grid;grid-template-columns:1fr 340px;height:100%}
.v.noinfo{grid-template-columns:1fr}
.v.noinfo aside{display:none}
.stage{position:relative;overflow:hidden;min-height:0;touch-action:pan-y}
.pane{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;will-change:transform}
.pane img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;transition:transform .2s;user-select:none;-webkit-user-drag:none}
.pane img.z{transform:scale(2.4);cursor:zoom-out}
.nav{z-index:3;position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;border:0;background:rgba(12,16,20,.55);color:#fff;font-size:26px;cursor:pointer;border-radius:6px}
.nav.l{left:10px}.nav.r{right:10px}
.top{z-index:3;position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.top .ct{margin-right:auto;background:rgba(12,16,20,.6);padding:6px 12px;border-radius:99px;font:500 13px var(--sans)}
.top button{border:0;background:rgba(12,16,20,.6);color:#fff;padding:8px 14px;border-radius:99px;cursor:pointer;font:500 13px var(--sans)}
aside{padding:26px 22px;overflow:auto;border-left:1px solid #2b333b}
aside h3{font:800 34px/.95 var(--sans);letter-spacing:-.03em;margin:0 0 18px}
aside dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 18px;font-size:15px}
aside dt{color:#9aa4af;font:500 13px var(--sans);padding-top:2px}
aside dd{margin:0;overflow-wrap:anywhere}
.sg{margin-top:20px;border-top:1px solid #2b333b;padding-top:14px}
.sg summary{cursor:pointer;font:600 14px var(--sans);color:#9fb0ff}
.sg label{display:block;font:500 13px var(--sans);color:#9aa4af;margin:12px 0 4px}
.sg textarea,.sg select,.sg input[type=email],.sg input[type=password],.sg input[type=text]{width:100%;background:#161c21;color:#eceff3;border:1px solid #2b333b;border-radius:8px;padding:9px 10px;font:15px var(--serif)}
.sg textarea{min-height:70px;resize:vertical}
.sg .hint{font-size:13px;color:#9aa4af;margin:4px 0 0}
.sg button{margin-top:12px;background:#9fb0ff;color:#0c1014;border:0;border-radius:99px;padding:9px 18px;font:600 14px var(--sans);cursor:pointer}
.sg button:disabled{opacity:.6}
.sgm{min-height:1.3em;font-size:14px;margin:8px 0 0}
.hp{position:absolute;left:-9999px}
aside a{color:#9fb0ff}
.cm{margin-top:22px;border-top:1px solid #2b333b;padding-top:16px}
.cm h4{font:600 13px var(--sans);color:#9aa4af;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em}
.cm blockquote{margin:0 0 14px;white-space:pre-wrap}
.cm cite{display:block;font:500 13px var(--sans);color:#9aa4af;margin-top:4px;font-style:normal}
.cm .none{color:#9aa4af;font-style:italic;margin:0 0 12px}
.addk{display:inline-block;background:#9fb0ff;color:#0c1014;text-decoration:none;font:600 14px var(--sans);padding:9px 16px;border-radius:99px}
.notes{font-style:italic;color:#c9d0d8}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .v{grid-template-columns:1fr;grid-template-rows:58% 42%}
  .v.noinfo{grid-template-rows:1fr}
  aside{border-left:0;border-top:1px solid #2b333b;padding:16px}
  aside h3{font-size:26px}
  .nav{width:40px;height:52px}
  h1{font-size:7vw;flex-basis:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---- data ---- */
function parseCSV(t){const out=[];let row=[],c="",inq=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(inq){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else inq=false}else c+=ch}
    else if(ch==='"')inq=true;else if(ch===","){row.push(c);c=""}
    else if(ch==="\n"){row.push(c);out.push(row);row=[];c=""}else if(ch!=="\r")c+=ch}
  if(c||row.length){row.push(c);out.push(row)}return out}
function isoDate(s){s=(s||"").trim().replace(/^(\d),(\d{3})$/,"$1$2");const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m?`${m[3]}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`:s}
const driveId = s => ((s||"").match(/[-\w]{25,}/)||[""])[0];
const src = (r,w) => r.data || `https://drive.google.com/thumbnail?id=${r.img}&sz=w${w}`;
function fb(i){const id=i.dataset.id;if(!id)return;const w=i.dataset.w||700,s=+(i.dataset.s||0)+1;i.dataset.s=s;
  const u=[`https://lh3.googleusercontent.com/d/${id}=w${w}`,`https://drive.google.com/uc?export=view&id=${id}`];
  if(s<=u.length)i.src=u[s-1];else{i.removeAttribute("src");i.parentElement.classList.add("bad")}}

function art(n){const h=(n*67)%360;
  const c=[0,1,2].map(i=>`<circle cx="${(n*37+i*90)%400}" cy="${60+(n*53+i*70)%180}" r="${30+(n*29+i*17)%60}" fill="hsl(${(h+i*30)%360} 45% ${35+i*12}%)" opacity=".75"/>`).join("");
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="hsl(${h} 40% 48%)"/>${c}<rect y="230" width="400" height="70" fill="hsl(${(h+50)%360} 30% 18%)" opacity=".55"/></svg>`)}

async function load(){
  if(!CONFIG.csvUrl){demo=true;rows=sample();return start()}
  try{
    const res=await fetch(CONFIG.csvUrl);if(!res.ok)throw 0;
    const t=parseCSV(await res.text()),head=t[0].map(h=>h.trim().toLowerCase()),C=CONFIG.columns,ix=k=>{const i=[].concat(C[k]).map(n=>head.indexOf(n.toLowerCase())).find(i=>i>=0);return i===undefined?-1:i};
    rows=t.slice(1).filter(r=>r.some(x=>x)).map((r,i)=>{const o={id:i};
      F.forEach(f=>o[f[0]]=(r[ix(f[0])]||"").trim());o.date=isoDate(o.date);
      o.img=driveId(r[ix("photo")]);
      o.status=ix("status")>=0?(r[ix("status")]||"").trim():CONFIG.approvedValue;return o})
     .filter(o=>o.img&&o.status.toLowerCase()===CONFIG.approvedValue.toLowerCase());
    start();loadContribs();
  }catch(e){$("out").innerHTML='<p class="msg">The archive could not be loaded. Check that the Sheet is published to the web as CSV and that CONFIG.csvUrl is correct.</p>'}

/* ---- state in URL so views can be shared ---- */
function readHash(){const p=new URLSearchParams(location.hash.slice(1));
  st.q=p.get("q")||"";st.sf=p.get("sort")||"date";st.sd=p.get("dir")==="-1"?-1:1;st.gf=p.get("group")||"";
  st.prog=new Set((p.get("prog")||"").split("|").filter(Boolean));st.dec=new Set((p.get("dec")||"").split("|").filter(Boolean))}
function writeHash(){const p=new URLSearchParams();
  if(st.q)p.set("q",st.q);if(st.sf!=="date")p.set("sort",st.sf);if(st.sd===-1)p.set("dir","-1");
  if(st.gf)p.set("group",st.gf);if(st.prog.size)p.set("prog",[...st.prog].join("|"));
  if(st.dec.size)p.set("dec",[...st.dec].join("|"));
  try{history.replaceState(null,"",p.toString()?"#"+p:location.pathname+location.search)}catch(e){}}

/* ---- render ---- */
async function loadContribs(){
  if(!CONFIG.contribCsvUrl)return;
  try{const res=await fetch(CONFIG.contribCsvUrl);if(!res.ok)return;
    const t=parseCSV(await res.text()),head=t[0].map(h=>h.trim().toLowerCase()),C=CONFIG.contribColumns,ix=k=>head.indexOf(C[k].toLowerCase());
    const byId={};
    t.slice(1).forEach(r=>{const id=driveId(r[ix("photo")]||""),text=(r[ix("text")]||"").trim();
      if(!id||!text||(r[ix("status")]||"").trim().toLowerCase()!==CONFIG.approvedValue.toLowerCase())return;
      (byId[id]=byId[id]||[]).push({name:(r[ix("name")]||"").trim(),text,when:r[ix("when")]||""})});
    rows.forEach(r=>{r.contribs=byId[r.img]||[]});
    render();
  }catch(e){}}

function build(){

function sync(){$("q").value=st.q;$("sf").value=st.sf;$("gf").value=st.gf;
  const n=st.prog.size+st.dec.size;

  const list=rows.filter(r=>{
    if(st.q&&!F.some(f=>r[f[0]].toLowerCase().includes(st.q.toLowerCase()))&&!(r.contribs||[]).some(c=>c.text.toLowerCase().includes(st.q.toLowerCase())))return false;
    if(st.prog.size&&![...st.prog].some(v=>v.toLowerCase()===r.coll.toLowerCase()))return false;

  }).sort((a,b)=>String(val(a,st.sf)).localeCompare(String(val(b,st.sf)),undefined,{numeric:true,sensitivity:"base"})*st.sd);
  const active=st.q||st.prog.size||st.dec.size;

  let groups=new Map();
  list.forEach(r=>{const g=st.gf?(val(r,st.gf)||"Unknown"):"";if(!groups.has(g))groups.set(g,[]);groups.get(g).push(r)});
  if(st.gf)groups=new Map([...groups].sort((a,b)=>a[0].localeCompare(b[0])*st.sd));

  $("out").innerHTML=list.length?[...groups].map(([g,items])=>
    (g?`<h2>${esc(g)}<small>${items.length}</small></h2>`:"")+`<div class="grid">`+items.map((r,i)=>
    `<button class="tile" data-id="${r.id}" aria-label="${esc(r.title||"Photo")}"><img src="${src(r,700)}" data-id="${r.img||""}" data-w="700" onerror="fb(this)" alt="" loading="lazy" referrerpolicy="no-referrer">${sub(r)?`<span><i>${esc(sub(r))}</i></span>`:""}</button>`).join("")+`</div>`).join("")
    :'<p class="msg">No photos match these filters. Try removing a tag or clearing the search.</p>';
}

/* ---- viewer: slide between photos, swipe on touch screens ---- */

const DUR=()=>matchMedia("(prefers-reduced-motion:reduce)").matches?0:320;

function pane(r){const d=document.createElement("div");d.className="pane";
  const pic=document.createElement("img");pic.dataset.id=r.img||"";pic.dataset.w=1800;pic.onerror=()=>fb(pic);pic.src=src(r,1800);pic.alt=r.title||"";pic.referrerPolicy="no-referrer";pic.draggable=false;
  const origin=e=>{const b=pic.getBoundingClientRect();pic.style.transformOrigin=`${(e.clientX-b.left)/b.width*100}% ${(e.clientY-b.top)/b.height*100}%`};
  pic.onclick=e=>{origin(e);pic.classList.toggle("z")};
  pic.onmousemove=e=>{if(pic.classList.contains("z"))origin(e)};
  d.appendChild(pic);return d}
function detail(r){return [[r.date?"Date":"Era",r.date||r.era],["Program",r.coll],["People",r.people],["Photographer",r.by],["Source",r.source],["File Name",r.file],["Tags",r.tags],["Comments",r.notes]]
  .map(([k,v])=>`<dt>${k}</dt><dd>${k==="Source"&&/^https?:\/\//i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a>`:esc(v||"—")}</dd>`).join("")}
function whenTxt(s){const d=new Date(s);return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",year:"numeric"})}
function addLink(r){const u=CONFIG.contribFormUrl,e=CONFIG.contribPhotoEntry;if(!u||!e||!r.img)return "";
  let q="?usp=pp_url&"+encodeURIComponent(e)+"="+encodeURIComponent(r.img);
  if(CONFIG.contribTitleEntry)q+="&"+encodeURIComponent(CONFIG.contribTitleEntry)+"="+encodeURIComponent(r.title||"");

  const f=(k,l,v,ph)=>`<label for="sg_${k}">${l}</label><input type="text" id="sg_${k}" name="${k}" value="${esc(v)}" data-orig="${esc(v)}" placeholder="${esc(ph||"")}" autocomplete="off">`;
  return `<details class="sg"><summary>Suggest a change or add information</summary><form class="sgf" novalidate>

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s.email)){msg.textContent="Please enter a valid email address.";return}
  const pw=pwSaved()||v("pw");
  if(!pw){msg.textContent="Please enter the archive password.";return}
  btn.disabled=true;msg.textContent="Sending…";
  try{await api("suggest",{password:pw,suggestion:s});
    try{sessionStorage.setItem("rowe-pw",pw)}catch(err){}
    f.innerHTML='<p class="sgm">Thank you! Your suggestion will appear after it has been reviewed.</p>'}
  catch(err){msg.textContent=err.message;btn.disabled=false}});
const KEY="rowe-archive-ok";
async function sha(t){if(!(window.crypto&&crypto.subtle))throw 0;
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("rowe-archive:"+t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function unlock(){document.body.classList.remove("locked");$("gate").hidden=true;load()}
function boot(){
  const h=CONFIG.passwordHash,helper=location.hash==="#makehash";
  let ok=false;try{ok=!!h&&localStorage.getItem(KEY)===h}catch(e){}
  if(!helper&&(!h||ok)){load();return}
  document.body.classList.add("locked");$("gate").hidden=false;$("pw").focus();
  if(helper){$("gt").textContent="Make a password code";$("pw").type="text";$("pw").placeholder="New password"}
  $("gform").onsubmit=async e=>{e.preventDefault();$("gerr").textContent="";
    try{const x=await sha($("pw").value);
      if(helper){$("hres").hidden=false;$("hres").innerHTML="Paste this into <b>passwordHash</b> in index.html:<br><code></code>";$("hres").querySelector("code").textContent=x;return}
      if(x===h){try{localStorage.setItem(KEY,h);sessionStorage.setItem("rowe-pw",$("pw").value)}catch(e){}unlock()}
      else{$("gerr").textContent="That password isn't right. Please try again.";$("pw").select()}
    }catch(err){$("gerr").textContent="This browser can't check passwords here. Try opening the site over https."}};
}
boot();
</script>
